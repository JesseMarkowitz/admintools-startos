name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n startos-admin.sh
      - name: shellcheck (zero warnings)
        run: shellcheck --severity=warning startos-admin.sh

  release-signature:
    # Fails when startos-admin.sh was changed without re-signing
    # (see RELEASING.md). Installed copies refuse unsigned releases,
    # so a red X here means the release is dead on arrival.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify startos-admin.sh.sig against embedded public key
        run: |
          awk '/^_UPDATE_PUBKEY="/,/^-----END PUBLIC KEY-----"$/' startos-admin.sh \
            | sed 's/^_UPDATE_PUBKEY="//; s/"$//' > pub.pem
          openssl pkey -pubin -in pub.pem -noout
          base64 -d startos-admin.sh.sig > sig.bin
          openssl dgst -sha256 -verify pub.pem -signature sig.bin startos-admin.sh
